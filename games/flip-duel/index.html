<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#17110c" />
  <meta name="description" content="흑돌과 백돌을 끼워 뒤집는 2인 보드게임. 봇 연습, 한 기기 2인, 온라인 방" />
  <title>흑백 뒤집기 대전</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../shared/ui-core.css" />
  <link rel="stylesheet" href="../../shared/kit.css" />
  <link rel="stylesheet" href="./style.css" />
  <!-- 3D 엔진 Babylon.js (한 파일, 브라우저 캐시에 저장됨) -->
  <script src="https://cdn.jsdelivr.net/npm/babylonjs@9.36.0/babylon.js" defer></script>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
</head>
<body>
  <noscript>이 게임은 자바스크립트가 필요해요.</noscript>
  <script type="module" src="./js/main.js"></script>
  <script>
    setTimeout(function () {
      var l = document.getElementById('loading');
      if (l && l.classList.contains('is-active')) l.innerHTML = '<p class="loading-text">불러오기가 오래 걸려요. 인터넷 연결을 확인하고 새로고침해 주세요.</p>';
    }, 15000);
  </script>
</body>
</html>
