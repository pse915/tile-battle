<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#24170f" />
  <meta name="description" content="시험 끝나고 친구들과 즐기는 3D 타일 클라이밍 게임" />
  <title>시험 끝! 타일 배틀</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div id="labels" aria-hidden="true"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <!-- 불러오는 중 -->
  <div id="loading" class="screen is-active">
    <p class="loading-text">타일 깎는 중…</p>
  </div>

  <!-- 타이틀 -->
  <section id="screen-title" class="screen" aria-label="타이틀">
    <div class="title-wrap">
      <div class="stamp">시험 끝!</div>
      <h1 class="title">타일 배틀</h1>
      <p class="title-sub">숫자 타일로 겨루는 클라이밍 게임</p>
      <button class="btn primary big" id="btn-title-start">시작하기</button>
    </div>
  </section>

  <!-- 메인 메뉴 -->
  <section id="screen-menu" class="screen" aria-label="메인 메뉴">
    <div class="sheet menu-sheet">
      <header class="sheet-head"><span class="mini-stamp">끝!</span> 타일 배틀</header>
      <div class="menu-list">
        <button class="btn primary big" data-go="solo">🤖 혼자 하기 <small>AI와 대결</small></button>
        <button class="btn big" data-go="online">🌐 온라인 방 <small>코드로 친구와 각자 폰에서</small></button>
        <button class="btn big" data-go="hot">👥 같이 하기 <small>한 기기로 돌려 가며</small></button>
        <button class="btn" data-go="tutorial">🎓 튜토리얼 다시 보기</button>
        <div class="menu-row">
          <button class="btn" data-go="rules">📜 규칙</button>
          <button class="btn" data-go="settings">⚙️ 설정</button>
        </div>
        <a class="btn" href="../../">🏠 다른 게임 고르기</a>
      </div>
    </div>
  </section>

  <!-- 게임 설정 -->
  <section id="screen-setup" class="screen" aria-label="게임 설정">
    <form class="sheet setup-sheet" id="setup-form" onsubmit="return false">
      <header class="sheet-head" id="setup-title">혼자 하기</header>
      <div class="field" id="field-nick">
        <label for="nick">닉네임</label>
        <input id="nick" maxlength="8" autocomplete="off" />
      </div>
      <fieldset class="field">
        <legend>인원</legend>
        <div class="seg" data-name="count">
          <label><input type="radio" name="count" value="3" checked /><span>3명</span></label>
          <label><input type="radio" name="count" value="4" /><span>4명</span></label>
          <label><input type="radio" name="count" value="5" /><span>5명</span></label>
        </div>
      </fieldset>
      <fieldset class="field" id="field-diff">
        <legend>AI 난이도</legend>
        <div class="seg">
          <label><input type="radio" name="diff" value="easy" /><span>쉬움</span></label>
          <label><input type="radio" name="diff" value="normal" checked /><span>보통</span></label>
          <label><input type="radio" name="diff" value="hard" /><span>어려움</span></label>
        </div>
      </fieldset>
      <fieldset class="field">
        <legend>라운드 수</legend>
        <div class="seg">
          <label><input type="radio" name="rounds" value="3" /><span>3판</span></label>
          <label><input type="radio" name="rounds" value="5" checked /><span>5판</span></label>
          <label><input type="radio" name="rounds" value="7" /><span>7판</span></label>
        </div>
      </fieldset>
      <div class="field" id="field-names" hidden>
        <label>참가자 이름</label>
        <div id="names-list" class="names-list"></div>
      </div>
      <div class="sheet-actions">
        <button type="button" class="btn" data-go="menu">뒤로</button>
        <button type="button" class="btn primary" id="btn-start-game">게임 시작</button>
      </div>
    </form>
  </section>

  <!-- 온라인: 방 만들기 / 참여 -->
  <section id="screen-online" class="screen" aria-label="온라인 방">
    <form class="sheet" id="online-form" onsubmit="return false">
      <header class="sheet-head">온라인 방</header>
      <p class="note setup-note" id="online-setup-note" hidden>온라인 서버가 아직 설정되지 않았어요. 선생님께 README의 ‘온라인 대기방 설정’을 부탁하세요.</p>
      <div class="field">
        <label for="online-nick">닉네임</label>
        <input id="online-nick" maxlength="8" autocomplete="off" />
      </div>
      <div class="field">
        <label for="room-code">친구 방에 들어가기</label>
        <div class="join-row">
          <input id="room-code" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="코드 4자리" autocomplete="off" />
          <button type="button" class="btn primary" id="btn-join-room">참여하기</button>
        </div>
      </div>
      <div class="or-line"><span>또는</span></div>
      <button type="button" class="btn big" id="btn-create-room">🏠 새 방 만들기 <small>코드를 친구에게 알려 주세요</small></button>
      <div class="sheet-actions">
        <button type="button" class="btn" data-go="menu">뒤로</button>
      </div>
    </form>
  </section>

  <!-- 온라인: 대기방 -->
  <section id="screen-lobby" class="screen" aria-label="대기방">
    <div class="sheet lobby-sheet">
      <header class="sheet-head">대기방 <span class="lobby-count" id="lobby-count"></span></header>
      <p class="lobby-label">방 코드</p>
      <div class="room-code" id="lobby-code" aria-live="polite"></div>
      <div class="share-row">
        <button class="btn small" id="btn-copy-code">코드 복사</button>
        <button class="btn small" id="btn-copy-link">초대 링크 복사</button>
      </div>
      <ul class="lobby-players" id="lobby-players"></ul>
      <div id="lobby-host">
        <div class="field">
          <label>봇 넣기</label>
          <div class="bot-row">
            <button class="btn small" data-bot="easy">🤖 쉬움</button>
            <button class="btn small" data-bot="normal">🤖 보통</button>
            <button class="btn small" data-bot="hard">🤖 어려움</button>
          </div>
        </div>
        <fieldset class="field">
          <legend>라운드 수</legend>
          <div class="seg">
            <label><input type="radio" name="lrounds" value="3" /><span>3판</span></label>
            <label><input type="radio" name="lrounds" value="5" checked /><span>5판</span></label>
            <label><input type="radio" name="lrounds" value="7" /><span>7판</span></label>
          </div>
        </fieldset>
      </div>
      <p id="lobby-guest" class="note">라운드 수: <b id="lobby-guest-rounds"></b></p>
      <p class="lobby-hint" id="lobby-hint"></p>
      <div class="sheet-actions">
        <button class="btn" id="btn-lobby-leave">나가기</button>
        <button class="btn primary" id="btn-lobby-start">게임 시작</button>
      </div>
    </div>
  </section>

  <!-- 설정 -->
  <section id="screen-settings" class="screen" aria-label="설정">
    <div class="sheet">
      <header class="sheet-head">설정</header>
      <div class="field">
        <label for="vol-bgm">배경음 <output id="out-bgm"></output></label>
        <input type="range" id="vol-bgm" min="0" max="1" step="0.05" />
      </div>
      <div class="field">
        <label for="vol-sfx">효과음 <output id="out-sfx"></output></label>
        <input type="range" id="vol-sfx" min="0" max="1" step="0.05" />
      </div>
      <label class="check"><input type="checkbox" id="chk-mute" /> 모든 소리 끄기</label>
      <fieldset class="field">
        <legend>그래픽 품질</legend>
        <div class="seg">
          <label><input type="radio" name="quality" value="high" /><span>높음</span></label>
          <label><input type="radio" name="quality" value="low" /><span>낮음 (느린 PC)</span></label>
        </div>
      </fieldset>
      <div class="sheet-actions">
        <button class="btn" id="btn-reset-tutorial">튜토리얼 처음부터 다시 띄우기</button>
        <button class="btn primary" data-go="menu">완료</button>
      </div>
    </div>
  </section>

  <!-- 규칙 -->
  <section id="screen-rules" class="screen" aria-label="규칙">
    <div class="sheet rules-sheet">
      <header class="sheet-head">규칙 한눈에 보기</header>
      <div class="rules-body" id="rules-body"></div>
      <div class="sheet-actions">
        <button class="btn primary" data-go="menu">닫기</button>
      </div>
    </div>
  </section>

  <!-- 게임 HUD -->
  <div id="hud" hidden>
    <div class="hud-top">
      <button class="icon-btn" id="btn-pause" aria-label="메뉴">☰</button>
      <div class="hud-info">
        <div class="hud-round" id="hud-round">라운드 1/5</div>
        <div class="hud-table" id="hud-table">구름 3을 가진 사람이 먼저 내요</div>
      </div>
      <button class="icon-btn" id="btn-sound" aria-label="소리 켜기/끄기">🔊</button>
      <button class="icon-btn" id="btn-help" aria-label="족보 강약표">?</button>
    </div>
    <div class="me-box" id="me-box"></div>
    <div class="turn-flag" id="turn-flag" hidden>내 차례!</div>
    <div class="action-bar" id="action-bar">
      <button class="btn sort-btn" id="btn-sort" aria-label="정렬 바꾸기">⇅ 숫자순</button>
      <button class="btn" id="btn-hint">💡 힌트</button>
      <button class="btn" id="btn-pass">패스</button>
      <button class="btn primary" id="btn-play">내기</button>
    </div>
  </div>

  <!-- 족보 강약표 -->
  <aside id="help-panel" class="sheet help-panel" hidden aria-label="족보 강약표">
    <header class="sheet-head">족보 강약표 <button class="icon-btn close" id="btn-help-close" aria-label="닫기">✕</button></header>
    <div id="help-body"></div>
  </aside>

  <!-- 튜토리얼 -->
  <div id="tutorial-layer" hidden>
    <div class="tut-spot" id="tut-spot"></div>
    <div class="tut-bubble" id="tut-bubble" role="dialog" aria-live="polite">
      <div class="tut-progress" id="tut-progress">1/6</div>
      <h2 id="tut-title"></h2>
      <div id="tut-body"></div>
      <div class="tut-actions">
        <button class="btn small" id="tut-skip">튜토리얼 건너뛰기</button>
        <span class="spacer"></span>
        <button class="btn small" id="tut-prev">이전</button>
        <button class="btn small primary" id="tut-next">다음</button>
      </div>
    </div>
  </div>

  <!-- 공용 모달 -->
  <div id="modal" class="modal" hidden>
    <div class="sheet modal-sheet" role="dialog" aria-modal="true">
      <header class="sheet-head" id="modal-title"></header>
      <div id="modal-body"></div>
      <div class="sheet-actions" id="modal-actions"></div>
    </div>
  </div>

  <div id="banner" class="banner" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>이 게임은 자바스크립트가 필요해요.</noscript>
  <script type="module" src="./js/main.js"></script>
  <script>
    // 학교망에서 CDN이 막혀 모듈을 못 불러오면 안내
    setTimeout(function () {
      var l = document.getElementById("loading");
      if (l && l.classList.contains("is-active")) l.innerHTML = "<p class=loading-text>불러오기가 오래 걸려요. 인터넷 연결을 확인하고 새로고침해 주세요.</p>";
    }, 15000);
  </script>
</body>
</html>
